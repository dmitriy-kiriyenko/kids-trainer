<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёры</title>
<meta name="theme-color" content="#0b0820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0820;
    --panel: rgba(255, 255, 255, .06);
    --border: rgba(255, 255, 255, .14);
    --text: #f4f1ff;
    --muted: #a9a3d1;
    --cyan: #22e3ff;
    --pink: #ff3ea5;
    --violet: #9b5cff;
    --yellow: #ffd23f;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100dvh;
    font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 12% 8%, rgba(155, 92, 255, .38), transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(34, 227, 255, .26), transparent 45%),
      radial-gradient(circle at 80% 15%, rgba(255, 62, 165, .18), transparent 35%),
      var(--bg);
    background-attachment: fixed;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px 56px; text-align: center; }
  h1 { margin: 0 0 28px; font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 900; }

  .card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 24px;
    color: inherit;
    text-decoration: none;
    transition: border-color .2s, transform .12s;
  }
  a.card:hover { border-color: var(--cyan); }
  a.card:active { transform: scale(.98); }
  .card + .card { margin-top: 16px; }
  .card strong { display: block; font-size: 1.6rem; font-weight: 900; }
  .card .a { color: var(--cyan); }
  .card .b { color: var(--pink); }
  .card span { color: var(--muted); }

  input, button {
    font: inherit;
    font-size: 1.3rem;
    width: 100%;
    border-radius: 18px;
    padding: 16px 20px;
  }
  input { color: var(--text); background: var(--panel); border: 2px solid var(--border); text-align: center; outline: none; }
  input:focus { border-color: var(--cyan); }
  button {
    margin-top: 14px;
    font-weight: 800;
    border: 0;
    cursor: pointer;
    color: #14082e;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
  }
</style>
</head>
<body>
<div class="wrap">
  <form id="nameForm" hidden>
    <h1>Привет! Как тебя зовут? 👋</h1>
    <input id="nameInput" required maxlength="30" autocomplete="given-name" autofocus>
    <button>Это я!</button>
  </form>

  <div id="games" hidden>
    <h1>Привет, <span id="player"></span>! 👋</h1>
    <a class="card" href="tsya/index.html">
      <strong><span class="a">ТСЯ</span> / <span class="b">ТЬСЯ</span></strong>
      <span>Когда в глаголе нужен мягкий знак</span>
    </a>
    <a class="card" href="rech/index.html">
      <strong><span class="a">Скажи</span> <span class="b">правильно</span></strong>
      <span>Найди речевую ошибку</span>
    </a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get: key => { try { return localStorage.getItem(key); } catch {} },
  set: (key, value) => { try { localStorage.setItem(key, value); } catch {} },
};

// The old gist-hosted version forwards its localStorage here as #import=<json of raw values>.
if (location.hash.startsWith('#import=')) {
  const data = JSON.parse(decodeURIComponent(location.hash.slice(8)));
  Object.entries(data).forEach(([key, value]) => store.get(key) ?? store.set(key, value));
  history.replaceState(null, '', location.pathname);
}

function render() {
  const player = store.get('player');
  $('nameForm').hidden = !!player;
  $('games').hidden = !player;
  $('player').textContent = player;
}

$('nameForm').onsubmit = e => {
  e.preventDefault();
  store.set('player', $('nameInput').value.trim());
  render();
};

render();
</script>
</body>
</html>
