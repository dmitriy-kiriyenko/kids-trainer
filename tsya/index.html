<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТСЯ или ТЬСЯ?</title>
<meta name="theme-color" content="#0b0820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
<style>
  .pill.soft { color: var(--pink); border-color: var(--pink); box-shadow: 0 0 14px rgba(255, 62, 165, .35); }
  .pill.hard { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 14px rgba(34, 227, 255, .35); }
  .sentence { font-size: clamp(1.55rem, 6vw, 2.4rem); line-height: 1.45; font-weight: 600; margin: 0; }
  .word { white-space: nowrap; font-weight: 800; }
  .gap {
    display: inline-block;
    min-width: 1.5em;
    margin: 0 .06em;
    padding: 0 .12em;
    text-align: center;
    color: var(--yellow);
    border-bottom: 4px dashed var(--yellow);
    line-height: 1.15;
  }
  .gap.ok { color: var(--lime); border-bottom: 4px solid var(--lime); text-shadow: 0 0 14px var(--lime); animation: pop .4s; }
  .gap.bad { color: var(--red); border-bottom: 4px solid var(--red); text-shadow: 0 0 14px var(--red); animation: pop .4s; }
  .ans.hard { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 22px rgba(34, 227, 255, .3), inset 0 0 22px rgba(34, 227, 255, .12); }
  .ans.soft { color: var(--pink); border-color: var(--pink); box-shadow: 0 0 22px rgba(255, 62, 165, .3), inset 0 0 22px rgba(255, 62, 165, .12); }
  .ans.hard:hover:not(:disabled) { background: rgba(34, 227, 255, .14); }
  .ans.soft:hover:not(:disabled) { background: rgba(255, 62, 165, .14); }
  .mistakes .word { color: var(--lime); }
</style>
</head>
<body>
<div class="wrap">

  <section id="home" class="screen active">
    <div class="hero">
      <a class="back" href="../index.html">← Все игры</a>
      <p class="greeting">Привет, <span data-player></span>! 👋</p>
      <h1 class="logo"><span class="a">ТСЯ</span><span class="slash">/</span><span class="b">ТЬСЯ</span></h1>
      <p class="tagline">Твой личный тренажёр</p>
      <button class="btn big" id="startBtn">▶ Начать игру</button>
    </div>

    <div class="card">
      <h2>🧠 Как не ошибиться</h2>
      <div class="rule">
        <div class="rule-item"><span class="pill soft">-ТЬСЯ</span><span>Что <b>делать</b>? Что <b>сделать</b>?<br>В вопросе есть <b>Ь</b> — пиши <b>Ь</b>.</span></div>
        <div class="rule-item"><span class="pill hard">-ТСЯ</span><span>Что <b>делает</b>? Что <b>сделает</b>?<br>В вопросе нет <b>Ь</b> — не пиши.</span></div>
      </div>
      <p class="rule-note">10 предложений, за каждый верный ответ — 10 баллов. Каждая игра новая!</p>
    </div>
  </section>
</div>

<script src="../shared/quiz.js"></script>
<script>
// [stem, perfective?, sentence with -ться, sentence with -тся]; "_" marks the verb.
const DB = [
  ['учи', 0, 'Мой брат очень любит _ в школе.', 'Сестра _ в пятом классе.'],
  ['готови', 0, 'Пора _ к контрольной работе.', 'Маша усердно _ к олимпиаде.'],
  ['нрави', 0, 'Новенькому хочется _ всем в классе.', 'Мне очень _ эта книга.'],
  ['сади', 0, 'Пассажирам пора _ в автобус.', 'Кот всегда _ на тёплый подоконник.'],
  ['ложи', 0, 'Накануне контрольной нужно рано _ спать.', 'Вечером пёс _ у камина.'],
  ['кружи', 0, 'Снежинки начали _ в воздухе.', 'Над полем высоко _ ястреб.'],
  ['торопи', 0, 'На контрольной не надо _.', 'Папа каждое утро _ на работу.'],
  ['станови', 0, 'Погода начинает _ теплее.', 'К вечеру на улице _ прохладно.'],
  ['останови', 1, 'Автобус должен _ у школы.', 'Через минуту поезд _ на станции.'],
  ['появи', 1, 'После дождя на небе может _ радуга.', 'Скоро на ветке _ первый листок.'],
  ['весели', 0, 'На празднике все будут _ и танцевать.', 'Малыш _ и хлопает в ладоши.'],
  ['горди', 0, 'Ты можешь _ своими успехами.', 'Дедушка _ своим садом.'],
  ['заблуди', 1, 'В густом лесу легко _.', 'Без компаса турист обязательно _.'],
  ['простуди', 1, 'Надень шапку, чтобы не _.', 'Без шарфа Петя быстро _.'],
  ['договори', 1, 'Друзьям нужно _ о встрече.', 'Завтра мама _ с учителем.'],
  ['познакоми', 1, 'Я хочу _ с новым соседом.', 'Завтра Оля _ с новой учительницей.'],
  ['подели', 1, 'Мне хочется _ с тобой яблоком.', 'Добрый мальчик обязательно _ конфетой.'],
  ['свети', 0, 'Старый фонарик перестал _.', 'В окне ярко _ лампа.'],
  ['крути', 0, 'Колесо продолжает _.', 'Во дворе весело _ карусель.'],
  ['серди', 0, 'Не стоит _ на друзей по пустякам.', 'Учитель _, когда мы шумим.'],
  ['стреми', 0, 'Нужно всегда _ к знаниям.', 'Спортсмен изо всех сил _ к победе.'],
  ['беспокои', 0, 'Не нужно _ из-за пустяков.', 'Бабушка _, если я опаздываю.'],
  ['успокои', 1, 'Тебе надо _ и подумать.', 'Малыш скоро _ и уснёт.'],
  ['получи', 1, 'У тебя всё должно _!', 'Если постараешься, всё _.'],
  ['научи', 1, 'Я мечтаю _ плавать.', 'Летом Коля _ кататься на велосипеде.'],
  ['спусти', 1, 'Альпинистам пора _ с горы.', 'Скоро лифт _ на первый этаж.'],
  ['труди', 0, 'Пчёлы привыкли _ целый день.', 'Муравей _ с утра до вечера.'],
  ['мири', 0, 'После ссоры важно уметь _.', 'Котёнок быстро _ с щенком.'],
];

const ending = item => item.soft ? 'ть' : 'т';
const fullWord = item => item.stem + ending(item) + 'ся';

function sentenceNodes(item, gap) {
  const [before, after] = item.text.split('_');
  const word = el('span', 'word');
  word.append(item.stem, gap, 'ся');
  return [before, word, after];
}

quiz({
  id: 'tsya',
  label: 'Вставь пропущенное',
  keys: 'Клавиши: <b>1</b> или <b>←</b> — ТСЯ, <b>2</b> или <b>→</b> — ТЬСЯ',
  deal: () => shuffle(DB.slice()).slice(0, QUESTIONS).map(([stem, perfective, softText, hardText]) => {
    const soft = Math.random() < .5;
    const questions = perfective ? ['Что сделать?', 'Что сделает?'] : ['Что делать?', 'Что делает?'];
    return { stem, soft, text: soft ? softText : hardText, question: questions[soft ? 0 : 1] };
  }),
  question(item) {
    item.gap = el('span', 'gap', '?');
    const p = el('p', 'sentence');
    p.append(...sentenceNodes(item, item.gap));
    return [p];
  },
  options: item => [
    { label: 'ТСЯ', cls: 'hard', ok: !item.soft },
    { label: 'ТЬСЯ', cls: 'soft', ok: item.soft },
  ],
  reveal(item, ok) {
    item.gap.textContent = ending(item);
    item.gap.classList.add(ok ? 'ok' : 'bad');
  },
  hint(item) {
    const check = el('span', 'check');
    check.append(`${item.question} → ${item.stem}`, el('em', null, ending(item)), 'ся');
    return [check, el('span', 'why', item.soft ? 'В вопросе есть Ь — и в глаголе пишем Ь.' : 'В вопросе нет Ь — и в глаголе не пишем.')];
  },
  mistake: item => [...sentenceNodes(item, el('span', null, ending(item))), el('span', 'sub', `${item.question} → ${fullWord(item)}`)],
});
</script>
</body>
</html>
